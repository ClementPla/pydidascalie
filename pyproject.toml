[tool.poetry]
name = "didascalie"
version = "0.2.0"
description = "Python library for creating and manipulating Didascalie annotation files"
readme = "README.md"
license = "MIT"
authors = ["Clement Playout"]
keywords = ["annotation", "medical imaging", "segmentation", "labeling"]

# This tells Poetry exactly which folder contains the code
packages = [{include = "didascalie"}]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.poetry.dependencies]
python = "^3.9"
pyzmq = "^26.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"